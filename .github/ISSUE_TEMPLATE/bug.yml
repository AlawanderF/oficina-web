name: Bug
description: Algo não funciona como esperado
labels: [bug]
body:
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu?
      placeholder: Descreva o problema e o que era esperado.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options: [API, Frontend, Banco/Prisma, Shared (Zod), CI/Infra]
    validations:
      required: true
